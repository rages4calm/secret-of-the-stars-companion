name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authored source, provenance and publication boundary
        run: python tools/check_public_source.py
